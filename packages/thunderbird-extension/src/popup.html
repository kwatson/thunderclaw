<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ThunderClaw</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icons/thunderclaw-64.png" alt="">
      <div><strong>ThunderClaw</strong><small id="status">Connecting…</small></div>
    </header>
    <main>
      <label>Model<select id="agent" disabled></select></label>
      <small id="connection"></small>
      <a href="options.html" target="_blank" rel="noopener">Connection settings</a>
      <label>Action<select id="action">
        <option value="improve">Improve</option>
        <option value="proofread">Proofread</option>
        <option value="shorten">Shorten</option>
        <option value="tone">Adjust tone</option>
        <option value="translate">Translate</option>
        <option value="summarize">Summarize</option>
        <option value="ask">Custom instruction</option>
      </select></label>
      <label><span id="instruction-label">Instruction (optional)</span><textarea id="instruction" rows="2" placeholder="For example: make this warmer" aria-describedby="error"></textarea></label>
      <button id="run" class="primary" disabled>Generate preview</button>
      <p id="privacy-note"><small>Your selected text and authored draft body are sent to your configured model. Recipients and quoted history stay in Thunderbird. Review the preview before applying it.</small></p>
      <section id="preview" hidden>
        <small>Preview</small>
        <div id="replacement"></div>
        <p id="summary"></p>
        <div class="actions"><button id="apply" class="primary">Apply to draft</button><button id="discard">Start over</button></div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
