name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  checks:
    name: Tests, types, and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          run_full=true

          if [[ "${{ github.event_name }}" != "workflow_dispatch" \
            && -n "$BASE_SHA" \
            && ! "$BASE_SHA" =~ ^0+$ \
            && -n "$TARGET_SHA" ]]; then
            run_full=false

            while IFS= read -r -d '' file; do
              case "$file" in
                docs/*)
                  ;;
                */*)
                  run_full=true
                  break
                  ;;
                *.md)
                  ;;
                *)
                  run_full=true
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$TARGET_SHA")
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

      - name: Documentation-only change
        if: steps.changes.outputs.run_full == 'false'
        run: echo "Full CI is not required for documentation-only changes."

      - name: Install managed runtimes
        if: steps.changes.outputs.run_full == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm ci

      - name: Run deterministic tests
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm test

      - name: Typecheck
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm run typecheck

      - name: Build release packages
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm run pack:release

  thunderbird-e2e:
    name: Thunderbird ${{ matrix.thunderbird }}
    needs: checks
    if: needs.checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        thunderbird:
          - 128.14.0esr
          - 153.0.1esr

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Run real Thunderbird tests
        env:
          THUNDERCLAW_E2E_VERSIONS: ${{ matrix.thunderbird }}
        run: mise exec -- npm run test:e2e:thunderbird

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderbird-${{ matrix.thunderbird }}-failure
          path: build/e2e/thunderbird/${{ matrix.thunderbird }}/
          if-no-files-found: warn
          retention-days: 7

  openclaw-integration:
    name: Pinned OpenClaw integration
    needs: checks
    if: needs.checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Qualify against pinned OpenClaw
        run: mise exec -- npm run test:integration:openclaw
