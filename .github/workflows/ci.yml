name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_qualification:
        description: Run expensive pre-release qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  checks:
    name: Tests, types, and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          run_full=true

          if [[ "${{ github.event_name }}" != "workflow_dispatch" \
            && -n "$BASE_SHA" \
            && ! "$BASE_SHA" =~ ^0+$ \
            && -n "$TARGET_SHA" ]]; then
            run_full=false

            while IFS= read -r -d '' file; do
              case "$file" in
                docs/*)
                  ;;
                */*)
                  run_full=true
                  break
                  ;;
                *.md)
                  ;;
                *)
                  run_full=true
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$TARGET_SHA")
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

      - name: Documentation-only change
        if: steps.changes.outputs.run_full == 'false'
        run: echo "Full CI is not required for documentation-only changes."

      - name: Install managed runtimes
        if: steps.changes.outputs.run_full == 'true'
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm ci

      - name: Run deterministic tests
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm test

      - name: Typecheck
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm run typecheck

      - name: Build release packages
        if: steps.changes.outputs.run_full == 'true'
        run: mise exec -- npm run pack:release

      - name: Record candidate XPI digest
        if: github.event_name == 'workflow_dispatch' && inputs.release_qualification == true && steps.changes.outputs.run_full == 'true'
        run: (cd build && sha256sum thunderclaw-extension.xpi > thunderclaw-extension.xpi.sha256)

      - name: Upload candidate XPI
        if: github.event_name == 'workflow_dispatch' && inputs.release_qualification == true && steps.changes.outputs.run_full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-ci-candidate
          path: |
            build/thunderclaw-extension.xpi
            build/thunderclaw-extension.xpi.sha256
          if-no-files-found: error
          retention-days: 7

  thunderbird-e2e:
    name: Thunderbird ${{ matrix.thunderbird }}
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.release_qualification == true && needs.checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        thunderbird:
          - 153.0.3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Download candidate XPI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-ci-candidate
          path: candidate

      - name: Verify candidate XPI digest
        run: (cd candidate && sha256sum --check thunderclaw-extension.xpi.sha256)

      - name: Run real Thunderbird tests
        env:
          THUNDERCLAW_E2E_VERSIONS: ${{ matrix.thunderbird }}
          THUNDERCLAW_E2E_XPI: ${{ github.workspace }}/candidate/thunderclaw-extension.xpi
        run: mise exec -- npm run test:e2e:thunderbird

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderbird-${{ matrix.thunderbird }}-failure
          path: build/e2e/thunderbird/${{ matrix.thunderbird }}/
          if-no-files-found: warn
          retention-days: 7

  native-platform:
    name: Native qualification on ${{ matrix.platform }}
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.release_qualification == true && needs.checks.outputs.run_full == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
            thunderbird: 153.0.3
            sha512: 1c845ead482fa04ce3fb2f769e569d8e22164f636642fa2c398341a318cc05796752c46c038c10d0f421d9a42c544cc54c6505b918a25ddf585267a2e4571464
            run_thunderbird_e2e: true
          - platform: macOS
            runner: macos-15
            run_thunderbird_e2e: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install Python
        if: matrix.run_thunderbird_e2e
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/thunderbird/requirements.txt

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Run native deterministic tests
        run: mise exec -- npm test

      - name: Qualify native filesystem security
        run: mise exec -- npm run qualify:native-filesystem

      - name: Download candidate XPI
        if: matrix.run_thunderbird_e2e
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-ci-candidate
          path: build

      - name: Verify candidate XPI digest
        if: matrix.run_thunderbird_e2e
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),c=require("node:crypto"); const p="build/thunderclaw-extension.xpi"; const expected=fs.readFileSync(`${p}.sha256`,"utf8").split(/\s/u)[0]; const actual=c.createHash("sha256").update(fs.readFileSync(p)).digest("hex"); if(actual!==expected) process.exit(1)'

      - name: Install Marionette dependencies
        if: matrix.run_thunderbird_e2e
        run: python -m pip install --disable-pip-version-check -r e2e/thunderbird/requirements.txt

      - name: Install pinned Thunderbird on Windows
        if: matrix.run_thunderbird_e2e && runner.os == 'Windows'
        id: thunderbird-windows
        shell: pwsh
        run: ./scripts/install-native-thunderbird.ps1 -Version '${{ matrix.thunderbird }}' -Sha512 '${{ matrix.sha512 }}'

      - name: Install pinned Thunderbird on macOS
        if: matrix.run_thunderbird_e2e && runner.os == 'macOS'
        id: thunderbird-macos
        shell: bash
        run: ./scripts/install-native-thunderbird.sh '${{ matrix.thunderbird }}' '${{ matrix.sha512 }}'

      - name: Run native Thunderbird qualification
        if: matrix.run_thunderbird_e2e
        shell: bash
        env:
          THUNDERBIRD_EXECUTABLE: ${{ steps.thunderbird-windows.outputs.thunderbird || steps.thunderbird-macos.outputs.thunderbird }}
          THUNDERBIRD_APPLICATION_INI: ${{ steps.thunderbird-windows.outputs.application_ini || steps.thunderbird-macos.outputs.application_ini }}
          THUNDERBIRD_ARTIFACTS: build/e2e/native/${{ runner.os }}/${{ matrix.thunderbird }}
        run: |
          python e2e/thunderbird/run_compose.py \
            --xpi build/thunderclaw-extension.xpi \
            --artifacts "${THUNDERBIRD_ARTIFACTS}" \
            --expected-version '${{ matrix.thunderbird }}' \
            --thunderbird "${THUNDERBIRD_EXECUTABLE}" \
            --application-ini "${THUNDERBIRD_APPLICATION_INI}" \
            --user-js e2e/thunderbird/user.js

      - name: Upload native qualification evidence
        if: ${{ matrix.run_thunderbird_e2e && !cancelled() && (failure() || github.event_name != 'pull_request') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderbird-${{ matrix.thunderbird }}-${{ runner.os }}
          path: build/e2e/native/${{ runner.os }}/${{ matrix.thunderbird }}/
          if-no-files-found: warn
          retention-days: 14

  openclaw-integration:
    name: Pinned OpenClaw 2026.8.1 integration
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.release_qualification == true && needs.checks.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Build explicit OpenClaw plugin candidate
        shell: bash
        run: |
          mise exec -- npm run pack:plugin
          version=$(mise exec -- node -p 'require("./packages/openclaw-plugin/package.json").version')
          echo "THUNDERCLAW_OPENCLAW_PLUGIN_TGZ=$GITHUB_WORKSPACE/build/thunderclaw-openclaw-plugin-${version}.tgz" >> "$GITHUB_ENV"

      - name: Qualify against pinned OpenClaw
        run: mise exec -- npm run test:integration:openclaw
