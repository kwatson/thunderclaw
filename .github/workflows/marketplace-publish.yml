name: Publish marketplaces

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish_clawhub:
        required: false
        type: boolean
        default: true
      submit_thunderbird:
        required: false
        type: boolean
        default: true
    secrets:
      CLAWHUB_TOKEN:
        required: false
      ATN_JWT_ISSUER:
        required: false
      ATN_JWT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified GitHub release tag to promote
        required: true
        type: string
      publish_clawhub:
        description: Publish the exact plugin archive to ClawHub
        required: true
        type: boolean
        default: true
      submit_thunderbird:
        description: Submit the exact XPI to Thunderbird Add-ons
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: marketplace-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify GitHub release bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Download and verify the qualified GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must have canonical form vX.Y.Z" >&2
            exit 1
          }
          git fetch --force --tags origin
          commit=$(git rev-list --max-count=1 "$RELEASE_TAG")
          test -n "$commit"
          version=${RELEASE_TAG#v}
          mkdir release
          gh release download "$RELEASE_TAG" --dir release
          mise exec -- node scripts/verify-marketplace-release.mjs \
            --directory release \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$commit"
          test "$(unzip -p "release/thunderclaw-thunderbird-${version}.xpi" manifest.json | jq -r .version)" = "$version"
          test "$(tar -xOf "release/thunderclaw-openclaw-plugin-${version}.tgz" package/package.json | jq -r .version)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Stage verified marketplace inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-marketplace-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  clawhub:
    name: Publish exact plugin archive to ClawHub
    if: inputs.publish_clawhub
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: clawhub
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Download verified marketplace inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-marketplace-${{ needs.prepare.outputs.version }}
          path: release

      - name: Reverify exact release bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: mise exec -- node scripts/verify-marketplace-release.mjs --directory release --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT"

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Check out pinned ClawHub publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openclaw/clawhub
          ref: 87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8 # v0.23.3
          path: clawhub-source
          persist-credentials: false

      - name: Install pinned ClawHub dependencies
        working-directory: clawhub-source
        run: bun install --frozen-lockfile

      - name: Configure ClawHub authentication
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CLAWHUB_TOKEN" ]]; then
            config="$RUNNER_TEMP/clawhub-config.json"
            jq -n --arg token "$CLAWHUB_TOKEN" \
              '{registry: "https://clawhub.ai", token: $token}' > "$config"
            chmod 600 "$config"
            echo "CLAWHUB_CONFIG_PATH=$config" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "CLAWHUB_TOKEN is required for tag-triggered publication; OIDC trusted publishing is supported only for workflow_dispatch" >&2
            exit 1
          elif [[ "$GITHUB_SHA" != "$RELEASE_COMMIT" || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "CLAWHUB_TOKEN is required to promote a historical release: trusted publishing binds source provenance to the workflow SHA and ref" >&2
            echo "For secretless OIDC, dispatch the workflow from $RELEASE_TAG after this workflow exists at that tag" >&2
            exit 1
          fi

      - name: Publish and wait for definitive ClawHub visibility
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          PLUGIN_ARCHIVE: ${{ github.workspace }}/release/thunderclaw-openclaw-plugin-${{ needs.prepare.outputs.version }}.tgz
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/clawhub-source/packages/clawhub/src/cli.ts"
          validation_root=$(mktemp -d /tmp/thunderclaw-clawhub.XXXXXX)
          trap 'find "$validation_root" -depth -delete' EXIT
          tar -xzf "$PLUGIN_ARCHIVE" -C "$validation_root"
          bun "$cli" package validate "$validation_root/package"
          publish_auth_args=()
          if [[ -n "$CLAWHUB_TOKEN" ]]; then
            publish_auth_args=(
              --owner thunderclaw
              --manual-override-reason "GitHub Actions publication of qualified ${RELEASE_TAG}"
            )
          fi
          bun "$cli" package publish "$PLUGIN_ARCHIVE" \
            --family code-plugin \
            --source-repo "https://github.com/$GITHUB_REPOSITORY" \
            --source-ref "$RELEASE_TAG" \
            --source-commit "$RELEASE_COMMIT" \
            --wait \
            --wait-timeout 2400 \
            "${publish_auth_args[@]}" \
            --json | tee "$RUNNER_TEMP/clawhub-publish.json"
          jq -e '.publicationStatus == "published"' "$RUNNER_TEMP/clawhub-publish.json"

      - name: Retain sanitized ClawHub publication result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-clawhub-publication-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/clawhub-publish.json
          if-no-files-found: error
          retention-days: 30

  thunderbird:
    name: Submit exact XPI to Thunderbird Add-ons
    if: inputs.submit_thunderbird
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: thunderbird-addons
    steps:
      - name: Check out publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Download verified marketplace inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-marketplace-${{ needs.prepare.outputs.version }}
          path: release

      - name: Reverify exact release bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: mise exec -- node scripts/verify-marketplace-release.mjs --directory release --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT"

      - name: Submit listed XPI and wait for ATN validation
        env:
          ATN_JWT_ISSUER: ${{ secrets.ATN_JWT_ISSUER }}
          ATN_JWT_SECRET: ${{ secrets.ATN_JWT_SECRET }}
          THUNDERCLAW_VERSION: ${{ needs.prepare.outputs.version }}
          THUNDERCLAW_XPI: ${{ github.workspace }}/release/thunderclaw-thunderbird-${{ needs.prepare.outputs.version }}.xpi
        run: mise exec -- node scripts/submit-thunderbird-addon.mjs | tee "$RUNNER_TEMP/atn-submission.json"

      - name: Record required reviewer-source handoff
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "### Thunderbird Add-ons submission"
            echo
            echo "The exact qualified XPI for ${RELEASE_TAG} was submitted and passed ATN validation."
            echo "ATN does not expose a supported API for reviewer-source or reviewer-note upload."
            echo "Attach \`thunderclaw-thunderbird-source-${RELEASE_VERSION}.zip\` from the GitHub release in the ATN Developer Hub before expecting review or publication."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain ATN validation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-atn-submission-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/atn-submission.json
          if-no-files-found: error
          retention-days: 30
