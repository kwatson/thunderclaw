name: Release OpenClaw plugin

on:
  push:
    tags:
      - "openclaw-plugin-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENCLAW_AUTOPILOT_ENABLED: ${{ vars.OPENCLAW_AUTOPILOT_ENABLED }}
  CI: "true"

jobs:
  classify:
    name: Select fail-closed release lane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_lane: ${{ steps.classifier.outputs.release_lane }}
      reservation_id: ${{ steps.classifier.outputs.reservation_id }}
      state_commit: ${{ steps.classifier.outputs.state_commit }}
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Verify active reservation and authenticated qualification evidence
        id: classifier
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          STATE_REF: refs/heads/automation/openclaw-autopilot-state
        shell: bash
        run: |
          set -euo pipefail
          echo "release_lane=manual" >> "$GITHUB_OUTPUT"
          foundation_tag=$(jq -r .foundation.tag openclaw-autopilot-foundation.json)
          if [[ "$RELEASE_TAG" == "$foundation_tag" ]]; then
            foundation=$(mise exec -- node scripts/verify-openclaw-foundation.mjs --root "$GITHUB_WORKSPACE" \
              --tag "$RELEASE_TAG" --commit "$RELEASE_SHA")
            test "$(jq -r .releaseLane <<<"$foundation")" = foundation
            test "$(jq -r .humanReviewRequired <<<"$foundation")" = true
            echo "release_lane=foundation" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          evidence_root=$(mktemp -d "$RUNNER_TEMP/thunderclaw-release-classifier.XXXXXX")
          trap 'git worktree remove --force "$evidence_root/trusted" 2>/dev/null || true; find "$evidence_root" -depth -delete' EXIT
          if ! state_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${STATE_REF#refs/}" --jq .object.sha 2>/dev/null); then
            echo "No active autopilot state ref; retaining the human-approved lane."
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/state.json?ref=$state_commit" --jq .content \
              | tr -d '\n' | base64 --decode > "$evidence_root/state.json"; then
            echo "The autopilot state could not be authenticated; retaining the human-approved lane."
            exit 0
          fi
          base_sha=$(jq -er .baseSha "$evidence_root/state.json") || exit 0
          git worktree add --detach "$evidence_root/trusted" "$base_sha"
          expected_classifier=$(jq -er '.outputs.preparation.automation.classifierSha' "$evidence_root/state.json") || exit 0
          actual_classifier=$(cd "$evidence_root/trusted" && { sha256sum scripts/classify-openclaw-release.mjs scripts/classify-openclaw-upgrade.mjs scripts/prepare-openclaw-upgrade.mjs scripts/openclaw-upgrade-policy.mjs scripts/openclaw-release-state.mjs scripts/verify-openclaw-autopilot-result.mjs scripts/openclaw-qualification.mjs scripts/assert-openclaw-autopilot-enabled.mjs scripts/classify-openclaw-qualification-failure.mjs scripts/verify-openclaw-foundation.mjs scripts/classify-change-scope.mjs; } | sha256sum | cut -d ' ' -f1)
          test "$actual_classifier" = "$expected_classifier" || {
            echo "The tagged classifier is not the exact reserved verifier; retaining the human-approved lane."
            exit 0
          }
          expected_workflow=$(jq -er '.outputs.preparation.automation.releaseWorkflowSha' "$evidence_root/state.json") || exit 0
          actual_workflow=$({ sha256sum .github/workflows/release-openclaw-plugin.yml .github/workflows/publish-clawhub.yml .github/workflows/complete-plugin-publication.yml; } | sha256sum | cut -d ' ' -f1)
          test "$actual_workflow" = "$expected_workflow" || {
            echo "The tagged release and publisher workflows are not the exact reserved workflows; retaining the human-approved lane."
            exit 0
          }
          request_id=$(jq -er '.outputs.qualification.requestId' "$evidence_root/state.json") || exit 0
          run_id=$(jq -er '.outputs.qualification.runId' "$evidence_root/state.json") || exit 0
          run_attempt=$(jq -er '.outputs.qualification.runAttempt' "$evidence_root/state.json") || exit 0
          artifact_name="openclaw-autopilot-result-${request_id}-${run_attempt}"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$evidence_root/run.json"; then
            echo "The reserved qualification run is unavailable; retaining the human-approved lane."
            exit 0
          fi
          if ! gh run download "$run_id" --name "$artifact_name" --dir "$evidence_root/artifact"; then
            echo "The immutable qualification evidence is unavailable; retaining the human-approved lane."
            exit 0
          fi
          candidate_tree=$(git show -s --format=%T "$RELEASE_SHA")
          if ! result=$(mise exec -- node "$evidence_root/trusted/scripts/classify-openclaw-release.mjs" \
              --root "$GITHUB_WORKSPACE" \
              --state "$evidence_root/state.json" \
              --state-commit "$state_commit" \
              --result "$evidence_root/artifact/result.json" \
              --run "$evidence_root/run.json" \
              --repository "$GITHUB_REPOSITORY" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --tag "$RELEASE_TAG" \
              --commit "$RELEASE_SHA" \
              --tree "$candidate_tree"); then
            echo "Autopilot evidence did not authorize this exact tag; retaining the human-approved lane."
            exit 0
          fi
          test "$(jq -r .releaseLane <<<"$result")" = automatic || exit 0
          echo "release_lane=automatic" >> "$GITHUB_OUTPUT"
          echo "reservation_id=$(jq -r .reservationId <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "state_commit=$state_commit" >> "$GITHUB_OUTPUT"

  build:
    name: Validate and build plugin once
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
      artifact_size: ${{ steps.artifact.outputs.size }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release tag commit must be contained in origin/main" >&2
            exit 1
          }

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Validate plugin tag, manifest, lockfile, and changelog
        id: metadata
        shell: bash
        run: |
          mkdir -p build
          metadata=$(mise exec -- node scripts/release-metadata.mjs \
            --tag "$GITHUB_REF_NAME" \
            --notes-output build/release-notes.md)
          test "$(jq -r .component <<<"$metadata")" = openclaw-plugin
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: mise exec -- npm ci

      - name: Run deterministic tests
        run: mise exec -- npm test

      - name: Typecheck
        run: mise exec -- npm run typecheck

      - name: Build plugin archive once
        run: mise exec -- npm run pack:plugin

      - name: Assemble plugin checksum and provenance
        id: artifact
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_root=build/release
          mkdir "$release_root"
          mv "build/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" "$release_root/"
          mv build/release-notes.md "$release_root/release-notes.md"
          (cd "$release_root" && sha256sum "thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" > SHA256SUMS)
          RELEASE_ROOT="$release_root" mise exec -- node --input-type=module <<'NODE'
          import { readFile, stat, writeFile } from "node:fs/promises";
          import path from "node:path";
          const root = process.env.RELEASE_ROOT;
          const [sha256, name] = (await readFile(path.join(root, "SHA256SUMS"), "utf8")).trim().split("  ");
          const provenance = {
            format: "thunderclaw-release-provenance-v2",
            component: "openclaw-plugin",
            source: {
              repository: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              tag: process.env.GITHUB_REF_NAME,
            },
            build: {
              workflow: process.env.GITHUB_WORKFLOW_REF,
              run: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            artifacts: [{ name, sha256, size: (await stat(path.join(root, name))).size }],
          };
          await writeFile(path.join(root, "release-provenance.json"), `${JSON.stringify(provenance, null, 2)}\n`);
          NODE
          echo "sha256=$(cut -d ' ' -f1 "$release_root/SHA256SUMS")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$release_root/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz")" >> "$GITHUB_OUTPUT"

      - name: Scan unpacked plugin for secrets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          scanner_root=$(mktemp -d /tmp/thunderclaw-gitleaks.XXXXXX)
          scan_root=$(mktemp -d /tmp/thunderclaw-release-scan.XXXXXX)
          trap 'find "$scanner_root" "$scan_root" -depth -delete' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$scanner_root/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | (cd "$scanner_root" && sha256sum --check -)
          tar -xzf "$scanner_root/gitleaks.tar.gz" -C "$scanner_root" gitleaks
          mkdir "$scan_root/plugin"
          tar -xzf "build/release/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" -C "$scan_root/plugin"
          "$scanner_root/gitleaks" dir "$scan_root" --no-banner --redact

      - name: Upload immutable plugin candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-openclaw-plugin-${{ steps.metadata.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: Qualify exact plugin archive
    needs: [classify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Install locked dependencies
        run: mise exec -- npm ci
      - name: Download plugin candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}
          path: release
      - name: Download and verify pinned Thunderbird counterpart
        id: counterpart
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          counterpart_tag=$(jq -r '."thunderbird-extension".tag' e2e/qualification/counterpart-baselines.json)
          counterpart_name=$(jq -r '."thunderbird-extension".name' e2e/qualification/counterpart-baselines.json)
          mkdir counterpart
          gh release download "$counterpart_tag" --pattern "$counterpart_name" --dir counterpart
          mise exec -- node scripts/verify-counterpart-baseline.mjs \
            --for-component openclaw-plugin \
            --artifact "counterpart/$counterpart_name"
          echo "path=$GITHUB_WORKSPACE/counterpart/$counterpart_name" >> "$GITHUB_OUTPUT"
      - name: Verify and qualify exact plugin bytes
        env:
          THUNDERCLAW_QUALIFICATION_COMPONENT: openclaw-plugin
          THUNDERCLAW_OPENCLAW_PLUGIN_TGZ: ${{ github.workspace }}/release/thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}.tgz
          THUNDERCLAW_E2E_XPI: ${{ steps.counterpart.outputs.path }}
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          mise exec -- npm run test:integration:openclaw

  paired-qualification:
    name: Qualify exact plugin with pinned extension
    needs: [classify, build]
    uses: ./.github/workflows/qualify-release-pair.yml
    with:
      component: openclaw-plugin
      version: ${{ needs.build.outputs.version }}
      candidate_artifact: thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}
      release_lane: ${{ needs.classify.outputs.release_lane }}
    secrets: inherit

  release:
    name: Create plugin GitHub release
    needs: [classify, build, qualify, paired-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.classify.outputs.release_lane == 'automatic' && 'release-auto' || 'release' }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Download qualified plugin candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}
          path: release
      - name: Verify qualified bytes
        run: (cd release && sha256sum --check SHA256SUMS)
      - name: Probe for an exact existing GitHub release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --json databaseId,name,body > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/existing-assets"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/existing-assets"
          for file in "thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" release-notes.md SHA256SUMS release-provenance.json; do
            cmp -s "release/$file" "$RUNNER_TEMP/existing-assets/$file" || {
              echo "Existing GitHub release has different $file bytes" >&2
              exit 1
            }
          done
          test "$(jq -r .name "$RUNNER_TEMP/existing-release.json")" = "ThunderClaw OpenClaw plugin ${RELEASE_VERSION}"
          jq -r .body "$RUNNER_TEMP/existing-release.json" > "$RUNNER_TEMP/existing-notes.md"
          cmp -s release/release-notes.md "$RUNNER_TEMP/existing-notes.md"
          gh attestation verify "release/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-openclaw-plugin.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$GITHUB_SHA"
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Re-read the live autopilot guard before provenance
        if: steps.existing.outputs.exists != 'true' && needs.classify.outputs.release_lane == 'automatic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
      - name: Attest plugin provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}.tgz
      - name: Create plugin GitHub release with canonical notes
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LANE: ${{ needs.classify.outputs.release_lane }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_LANE" == automatic ]]; then mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null; fi
          gh release create "$GITHUB_REF_NAME" \
            "release/thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}.tgz" \
            release/release-notes.md \
            release/SHA256SUMS \
            release/release-provenance.json \
            --verify-tag \
            --title "ThunderClaw OpenClaw plugin ${{ needs.build.outputs.version }}" \
            --notes-file release/release-notes.md

  clawhub:
    name: Promote manually qualified plugin to ClawHub
    if: needs.classify.outputs.release_lane != 'automatic'
    needs: [classify, release]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-clawhub.yml
    with:
      tag: ${{ github.ref_name }}
      release_lane: ${{ needs.classify.outputs.release_lane }}
    secrets: inherit

  publication-closeout:
    name: Complete automatic plugin publication
    if: needs.classify.outputs.release_lane == 'automatic'
    needs: [classify, release]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/complete-plugin-publication.yml
    with:
      tag: ${{ github.ref_name }}
      release_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
