name: Release OpenClaw plugin

on:
  push:
    tags:
      - "openclaw-plugin-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  classify:
    name: Select fail-closed release lane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_lane: ${{ steps.classifier.outputs.release_lane }}
      reservation_id: ${{ steps.classifier.outputs.reservation_id }}
      state_commit: ${{ steps.classifier.outputs.state_commit }}
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Verify active reservation and authenticated qualification evidence
        id: classifier
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          STATE_REF: refs/heads/automation/openclaw-autopilot-state
        shell: bash
        run: |
          set -euo pipefail
          echo "release_lane=manual" >> "$GITHUB_OUTPUT"
          foundation_tag=$(jq -r .foundation.tag openclaw-autopilot-foundation.json)
          if [[ "$RELEASE_TAG" == "$foundation_tag" ]]; then
            foundation=$(mise exec -- node scripts/verify-openclaw-foundation.mjs --root "$GITHUB_WORKSPACE" \
              --tag "$RELEASE_TAG" --commit "$RELEASE_SHA")
            test "$(jq -r .releaseLane <<<"$foundation")" = foundation
            test "$(jq -r .humanReviewRequired <<<"$foundation")" = true
            echo "release_lane=foundation" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          evidence_root=$(mktemp -d "$RUNNER_TEMP/thunderclaw-release-classifier.XXXXXX")
          trap 'git worktree remove --force "$evidence_root/trusted" 2>/dev/null || true; find "$evidence_root" -depth -delete' EXIT
          if ! state_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${STATE_REF#refs/}" --jq .object.sha 2>/dev/null); then
            echo "No active autopilot state ref; retaining the human-approved lane."
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/state.json?ref=$state_commit" --jq .content \
              | tr -d '\n' | base64 --decode > "$evidence_root/state.json"; then
            echo "The autopilot state could not be authenticated; retaining the human-approved lane."
            exit 0
          fi
          base_sha=$(jq -er .baseSha "$evidence_root/state.json") || exit 0
          git worktree add --detach "$evidence_root/trusted" "$base_sha"
          expected_classifier=$(jq -er '.outputs.preparation.automation.classifierSha' "$evidence_root/state.json") || exit 0
          actual_classifier=$(cd "$evidence_root/trusted" && { sha256sum scripts/classify-openclaw-release.mjs scripts/classify-openclaw-upgrade.mjs scripts/prepare-openclaw-upgrade.mjs scripts/openclaw-upgrade-policy.mjs scripts/openclaw-release-state.mjs scripts/verify-openclaw-autopilot-result.mjs scripts/openclaw-qualification.mjs scripts/assert-openclaw-autopilot-enabled.mjs scripts/classify-openclaw-qualification-failure.mjs scripts/verify-openclaw-foundation.mjs; } | sha256sum | cut -d ' ' -f1)
          test "$actual_classifier" = "$expected_classifier" || {
            echo "The tagged classifier is not the exact reserved verifier; retaining the human-approved lane."
            exit 0
          }
          expected_workflow=$(jq -er '.outputs.preparation.automation.releaseWorkflowSha' "$evidence_root/state.json") || exit 0
          actual_workflow=$({ sha256sum .github/workflows/release-openclaw-plugin.yml .github/workflows/publish-clawhub.yml; } | sha256sum | cut -d ' ' -f1)
          test "$actual_workflow" = "$expected_workflow" || {
            echo "The tagged release and publisher workflows are not the exact reserved workflows; retaining the human-approved lane."
            exit 0
          }
          request_id=$(jq -er '.outputs.qualification.requestId' "$evidence_root/state.json") || exit 0
          run_id=$(jq -er '.outputs.qualification.runId' "$evidence_root/state.json") || exit 0
          run_attempt=$(jq -er '.outputs.qualification.runAttempt' "$evidence_root/state.json") || exit 0
          artifact_name="openclaw-autopilot-result-${request_id}-${run_attempt}"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$evidence_root/run.json"; then
            echo "The reserved qualification run is unavailable; retaining the human-approved lane."
            exit 0
          fi
          if ! gh run download "$run_id" --name "$artifact_name" --dir "$evidence_root/artifact"; then
            echo "The immutable qualification evidence is unavailable; retaining the human-approved lane."
            exit 0
          fi
          candidate_tree=$(git show -s --format=%T "$RELEASE_SHA")
          if ! result=$(mise exec -- node "$evidence_root/trusted/scripts/classify-openclaw-release.mjs" \
              --root "$GITHUB_WORKSPACE" \
              --state "$evidence_root/state.json" \
              --state-commit "$state_commit" \
              --result "$evidence_root/artifact/result.json" \
              --run "$evidence_root/run.json" \
              --repository "$GITHUB_REPOSITORY" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --tag "$RELEASE_TAG" \
              --commit "$RELEASE_SHA" \
              --tree "$candidate_tree"); then
            echo "Autopilot evidence did not authorize this exact tag; retaining the human-approved lane."
            exit 0
          fi
          test "$(jq -r .releaseLane <<<"$result")" = automatic || exit 0
          echo "release_lane=automatic" >> "$GITHUB_OUTPUT"
          echo "reservation_id=$(jq -r .reservationId <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "state_commit=$state_commit" >> "$GITHUB_OUTPUT"

  build:
    name: Validate and build plugin once
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
      artifact_size: ${{ steps.artifact.outputs.size }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to main
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release tag commit must be contained in origin/main" >&2
            exit 1
          }

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Validate plugin tag, manifest, lockfile, and changelog
        id: metadata
        shell: bash
        run: |
          mkdir -p build
          metadata=$(mise exec -- node scripts/release-metadata.mjs \
            --tag "$GITHUB_REF_NAME" \
            --notes-output build/release-notes.md)
          test "$(jq -r .component <<<"$metadata")" = openclaw-plugin
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: mise exec -- npm ci

      - name: Run deterministic tests
        run: mise exec -- npm test

      - name: Typecheck
        run: mise exec -- npm run typecheck

      - name: Build plugin archive once
        run: mise exec -- npm run pack:plugin

      - name: Assemble plugin checksum and provenance
        id: artifact
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_root=build/release
          mkdir "$release_root"
          mv "build/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" "$release_root/"
          mv build/release-notes.md "$release_root/release-notes.md"
          (cd "$release_root" && sha256sum "thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" > SHA256SUMS)
          RELEASE_ROOT="$release_root" mise exec -- node --input-type=module <<'NODE'
          import { readFile, stat, writeFile } from "node:fs/promises";
          import path from "node:path";
          const root = process.env.RELEASE_ROOT;
          const [sha256, name] = (await readFile(path.join(root, "SHA256SUMS"), "utf8")).trim().split("  ");
          const provenance = {
            format: "thunderclaw-release-provenance-v2",
            component: "openclaw-plugin",
            source: {
              repository: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              tag: process.env.GITHUB_REF_NAME,
            },
            build: {
              workflow: process.env.GITHUB_WORKFLOW_REF,
              run: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            artifacts: [{ name, sha256, size: (await stat(path.join(root, name))).size }],
          };
          await writeFile(path.join(root, "release-provenance.json"), `${JSON.stringify(provenance, null, 2)}\n`);
          NODE
          echo "sha256=$(cut -d ' ' -f1 "$release_root/SHA256SUMS")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$release_root/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz")" >> "$GITHUB_OUTPUT"

      - name: Scan unpacked plugin for secrets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          scanner_root=$(mktemp -d /tmp/thunderclaw-gitleaks.XXXXXX)
          scan_root=$(mktemp -d /tmp/thunderclaw-release-scan.XXXXXX)
          trap 'find "$scanner_root" "$scan_root" -depth -delete' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$scanner_root/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | (cd "$scanner_root" && sha256sum --check -)
          tar -xzf "$scanner_root/gitleaks.tar.gz" -C "$scanner_root" gitleaks
          mkdir "$scan_root/plugin"
          tar -xzf "build/release/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" -C "$scan_root/plugin"
          "$scanner_root/gitleaks" dir "$scan_root" --no-banner --redact

      - name: Upload immutable plugin candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-openclaw-plugin-${{ steps.metadata.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: Qualify exact plugin archive
    needs: [classify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Install locked dependencies
        run: mise exec -- npm ci
      - name: Download plugin candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}
          path: release
      - name: Download and verify pinned Thunderbird counterpart
        id: counterpart
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          counterpart_tag=$(jq -r '."thunderbird-extension".tag' e2e/qualification/counterpart-baselines.json)
          counterpart_name=$(jq -r '."thunderbird-extension".name' e2e/qualification/counterpart-baselines.json)
          mkdir counterpart
          gh release download "$counterpart_tag" --pattern "$counterpart_name" --dir counterpart
          mise exec -- node scripts/verify-counterpart-baseline.mjs \
            --for-component openclaw-plugin \
            --artifact "counterpart/$counterpart_name"
          echo "path=$GITHUB_WORKSPACE/counterpart/$counterpart_name" >> "$GITHUB_OUTPUT"
      - name: Verify and qualify exact plugin bytes
        env:
          THUNDERCLAW_QUALIFICATION_COMPONENT: openclaw-plugin
          THUNDERCLAW_OPENCLAW_PLUGIN_TGZ: ${{ github.workspace }}/release/thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}.tgz
          THUNDERCLAW_E2E_XPI: ${{ steps.counterpart.outputs.path }}
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          mise exec -- npm run test:integration:openclaw

  paired-qualification:
    name: Qualify exact plugin with pinned extension
    needs: [classify, build]
    uses: ./.github/workflows/qualify-release-pair.yml
    with:
      component: openclaw-plugin
      version: ${{ needs.build.outputs.version }}
      candidate_artifact: thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}
      release_lane: ${{ needs.classify.outputs.release_lane }}
    secrets: inherit

  release:
    name: Create plugin GitHub release
    needs: [classify, build, qualify, paired-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.classify.outputs.release_lane == 'automatic' && 'release-auto' || 'release' }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Download qualified plugin candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}
          path: release
      - name: Verify qualified bytes
        run: (cd release && sha256sum --check SHA256SUMS)
      - name: Probe for an exact existing GitHub release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --json databaseId,name,body > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/existing-assets"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/existing-assets"
          for file in "thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" release-notes.md SHA256SUMS release-provenance.json; do
            cmp -s "release/$file" "$RUNNER_TEMP/existing-assets/$file" || {
              echo "Existing GitHub release has different $file bytes" >&2
              exit 1
            }
          done
          test "$(jq -r .name "$RUNNER_TEMP/existing-release.json")" = "ThunderClaw OpenClaw plugin ${RELEASE_VERSION}"
          jq -r .body "$RUNNER_TEMP/existing-release.json" > "$RUNNER_TEMP/existing-notes.md"
          cmp -s release/release-notes.md "$RUNNER_TEMP/existing-notes.md"
          gh attestation verify "release/thunderclaw-openclaw-plugin-${RELEASE_VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-openclaw-plugin.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$GITHUB_SHA"
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Re-read the live autopilot guard before provenance
        if: steps.existing.outputs.exists != 'true' && needs.classify.outputs.release_lane == 'automatic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
      - name: Attest plugin provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}.tgz
      - name: Create plugin GitHub release with canonical notes
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LANE: ${{ needs.classify.outputs.release_lane }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_LANE" == automatic ]]; then mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null; fi
          gh release create "$GITHUB_REF_NAME" \
            "release/thunderclaw-openclaw-plugin-${{ needs.build.outputs.version }}.tgz" \
            release/release-notes.md \
            release/SHA256SUMS \
            release/release-provenance.json \
            --verify-tag \
            --title "ThunderClaw OpenClaw plugin ${{ needs.build.outputs.version }}" \
            --notes-file release/release-notes.md

  clawhub:
    name: Promote manually qualified plugin to ClawHub
    if: needs.classify.outputs.release_lane != 'automatic'
    needs: [classify, release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-clawhub.yml
    with:
      tag: ${{ github.ref_name }}
      release_lane: ${{ needs.classify.outputs.release_lane }}
    secrets: inherit

  clawhub-auto:
    name: Dispatch and verify tokenless ClawHub promotion
    if: needs.classify.outputs.release_lane == 'automatic'
    needs: [classify, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: autopilot-closeout
    permissions:
      contents: read
    steps:
      - name: Mint the narrow workflow-dispatch token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.OPENCLAW_AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.OPENCLAW_AUTOPILOT_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: read
      - name: Dispatch and await the exact protected-tag publisher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="Publish ClawHub $RELEASE_TAG (automatic)"
          find_run() {
            gh run list --workflow .github/workflows/publish-clawhub.yml --event workflow_dispatch --limit 50 \
              --json databaseId,displayTitle,headBranch,headSha,status,conclusion,createdAt \
              | jq -c --arg title "$title" --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
                '[.[] | select(.displayTitle == $title and .headBranch == $tag and .headSha == $commit)] | first // empty'
          }
          run=$(find_run)
          if [[ -n "$run" && "$(jq -r .status <<<"$run")" == completed && "$(jq -r .conclusion <<<"$run")" == cancelled ]]; then
            echo "The exact publisher run was cancelled; an explicit operator retry is required" >&2
            exit 1
          fi
          if [[ -n "$run" && "$(jq -r .status <<<"$run")" == completed && "$(jq -r .conclusion <<<"$run")" != success ]]; then
            mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
            gh run rerun "$(jq -r .databaseId <<<"$run")" --failed
            run=""
          elif [[ -z "$run" ]]; then
            mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
            set +e
            gh workflow run .github/workflows/publish-clawhub.yml --ref "$RELEASE_TAG" \
              -f tag="$RELEASE_TAG" -f release_lane=automatic
            dispatch_status=$?
            set -e
            if [[ "$dispatch_status" -ne 0 ]]; then
              echo "::warning::Publisher dispatch was not acknowledged; probing for the exact run before deciding the outcome."
            fi
            run=""
          fi
          for _ in $(seq 1 240); do
            if [[ -z "$run" ]]; then run=$(find_run); fi
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == completed ]]; then
              if [[ "$(jq -r .conclusion <<<"$run")" == success ]]; then
                run_id=$(jq -r .databaseId <<<"$run")
                run_details=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
                test "$(jq -r .event <<<"$run_details")" = workflow_dispatch
                run_path=$(jq -r .path <<<"$run_details")
                test "${run_path%@*}" = .github/workflows/publish-clawhub.yml
                test "$(jq -r .head_sha <<<"$run_details")" = "$RELEASE_COMMIT"
                exit 0
              fi
            fi
            sleep 10
            run=""
          done
          echo "Timed out waiting for the exact ClawHub publication workflow" >&2
          exit 1

  counterpart-closeout:
    name: Open exact counterpart baseline closeout
    if: needs.classify.outputs.release_lane == 'automatic'
    needs: [classify, build, clawhub-auto]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: autopilot-closeout
    permissions:
      contents: read
    steps:
      - name: Mint a narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.OPENCLAW_AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.OPENCLAW_AUTOPILOT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
      - name: Check out current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Verify public bytes and prepare the one-file closeout
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(mise exec -- node scripts/update-counterpart-baseline.mjs \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --expected-sha256 '${{ needs.build.outputs.artifact_sha256 }}' \
            --expected-size '${{ needs.build.outputs.artifact_size }}')
          status=$(jq -r .status <<<"$result")
          case "$status" in
            already-complete)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
            updated)
              test "$(git diff --name-only)" = e2e/qualification/counterpart-baselines.json || {
                echo "Counterpart closeout may change exactly one file" >&2
                exit 1
              }
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown counterpart updater status" >&2; exit 1 ;;
          esac
          echo "baseline=$(jq -c --arg repository "$GITHUB_REPOSITORY" '.baseline + {repository:$repository}' <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: Open or update deterministic closeout pull request
        id: closeout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/counterpart-${RELEASE_TAG}"
          if [[ "${{ steps.update.outputs.changed }}" == true ]]; then
            desired=$(mktemp "$RUNNER_TEMP/counterpart-baseline.XXXXXX")
            cp e2e/qualification/counterpart-baselines.json "$desired"
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
              unexpected=$(git diff --name-only origin/main..."refs/remotes/origin/$branch" \
                | grep -Fvx e2e/qualification/counterpart-baselines.json || true)
              test -z "$unexpected" || { echo "Existing closeout branch changes unexpected files" >&2; exit 1; }
              git switch --create "$branch" "refs/remotes/origin/$branch"
            else
              git switch --create "$branch" origin/main
            fi
            cp "$desired" e2e/qualification/counterpart-baselines.json
            git config user.name thunderclaw-autopilot[bot]
            git config user.email 000000+thunderclaw-autopilot[bot]@users.noreply.github.com
            if ! git diff --quiet -- e2e/qualification/counterpart-baselines.json; then
              git add e2e/qualification/counterpart-baselines.json
              git commit -m "chore(release): record ${RELEASE_TAG} counterpart"
              mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
              git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                push origin "HEAD:refs/heads/$branch"
            fi
          fi
          pr=$(gh pr list --head "$branch" --state all --json number,state,mergedAt --jq '.[0] // empty')
          if [[ -z "$pr" ]]; then
            mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
            gh pr create --head "$branch" --base main \
              --title "Record ${RELEASE_TAG} counterpart" \
              --body "Records the exact publicly verified ${RELEASE_TAG} artifact for future pair qualification."
            pr=$(gh pr list --head "$branch" --state open --json number,state,mergedAt --jq '.[0]')
          fi
          state=$(jq -r .state <<<"$pr")
          [[ "$state" == OPEN || "$state" == MERGED ]] || { echo "Existing closeout pull request is closed without merge" >&2; exit 1; }
          pr_number=$(jq -r .number <<<"$pr")
          pr_details=$(gh pr view "$pr_number" --json headRefOid,mergeCommit)
          head_sha=$(jq -r .headRefOid <<<"$pr_details")
          head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_tree=$head_tree" >> "$GITHUB_OUTPUT"
          echo "merged=$([[ "$state" == MERGED ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$state" == MERGED ]]; then
            merge_sha=$(jq -r .mergeCommit.oid <<<"$pr_details")
            merge_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq .tree.sha)
            echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
            echo "merge_tree=$merge_tree" >> "$GITHUB_OUTPUT"
          fi
      - name: Record verified publication and closeout state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_STATE_COMMIT: ${{ needs.classify.outputs.state_commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          BASELINE: ${{ steps.update.outputs.baseline }}
          CLOSEOUT_BRANCH: ${{ steps.closeout.outputs.branch }}
          CLOSEOUT_PR: ${{ steps.closeout.outputs.pr_number }}
          CLOSEOUT_HEAD_SHA: ${{ steps.closeout.outputs.head_sha }}
          CLOSEOUT_HEAD_TREE: ${{ steps.closeout.outputs.head_tree }}
          CLOSEOUT_MERGED: ${{ steps.closeout.outputs.merged }}
          CLOSEOUT_MERGE_SHA: ${{ steps.closeout.outputs.merge_sha }}
          CLOSEOUT_MERGE_TREE: ${{ steps.closeout.outputs.merge_tree }}
          STATE_REF: refs/heads/automation/openclaw-autopilot-state
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/openclaw-closeout-state.XXXXXX")
          trap 'find "$work" -depth -delete' EXIT
          git fetch --no-tags origin "+$STATE_REF:refs/remotes/origin/openclaw-autopilot-state"
          state_commit=$(git rev-parse refs/remotes/origin/openclaw-autopilot-state)
          git show "$state_commit:state.json" > "$work/state.json"
          test "$(jq -r .outputs.preparation.tag "$work/state.json")" = "$RELEASE_TAG"
          update_state() {
            local intent=$1 message=$2
            mise exec -- node scripts/openclaw-release-state.mjs apply --state "$work/state.json" --intent "$intent" | jq .state > "$work/next.json"
            blob=$(git hash-object -w "$work/next.json")
            tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
            next_commit=$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$state_commit")
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin \
              --force-with-lease="$STATE_REF:$state_commit" "$next_commit:$STATE_REF"
            state_commit=$next_commit
            mv "$work/next.json" "$work/state.json"
          }
          release=$(gh release view "$RELEASE_TAG" --json databaseId)
          artifact_sha=$(jq -r .sha256 <<<"$BASELINE")
          if [[ "$(jq -r .phase "$work/state.json")" == tagged ]]; then
            jq -n --arg id "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" \
              --arg artifactSha256 "$artifact_sha" --argjson releaseId "$(jq -r .databaseId <<<"$release")" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"record-github-publication",at:$at,payload:{tag:$tag,commit:$commit,artifactSha256:$artifactSha256,releaseId:$releaseId}}' > "$work/intent.json"
            update_state "$work/intent.json" "Record GitHub publication"
          fi
          test "$(jq -r .outputs.githubPublication.artifactSha256 "$work/state.json")" = "$artifact_sha"
          if [[ "$(jq -r .phase "$work/state.json")" == github-published ]]; then
            jq -n --arg id "clawhub-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
              --arg artifactSha256 "$artifact_sha" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"record-clawhub-verification",at:$at,payload:{tag:$tag,version:$version,artifactSha256:$artifactSha256,verifiedAt:$at}}' > "$work/intent.json"
            update_state "$work/intent.json" "Record ClawHub verification"
          fi
          test "$(jq -r .outputs.clawhubVerification.artifactSha256 "$work/state.json")" = "$artifact_sha"
          if [[ "$(jq -r .phase "$work/state.json")" == clawhub-verified ]]; then
            jq -n --arg id "closeout-$CLOSEOUT_PR" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg branch "$CLOSEOUT_BRANCH" \
              --argjson prNumber "$CLOSEOUT_PR" --argjson baseline "$BASELINE" --arg headSha "$CLOSEOUT_HEAD_SHA" --arg tree "$CLOSEOUT_HEAD_TREE" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"open-closeout",at:$at,payload:{branch:$branch,prNumber:$prNumber,baseline:$baseline,headSha:$headSha,tree:$tree}}' > "$work/intent.json"
            update_state "$work/intent.json" "Record counterpart closeout"
          fi
          test "$(jq -r .outputs.closeout.prNumber "$work/state.json")" = "$CLOSEOUT_PR"
          if [[ "$CLOSEOUT_MERGED" == true ]]; then
            jq -n --arg id "complete-$CLOSEOUT_MERGE_SHA" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg mergeSha "$CLOSEOUT_MERGE_SHA" --arg mergeTree "$CLOSEOUT_MERGE_TREE" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"complete-closeout",at:$at,payload:{mergeSha:$mergeSha,mergeTree:$mergeTree}}' > "$work/intent.json"
            update_state "$work/intent.json" "Complete counterpart closeout"
          fi
      - name: Enable guarded closeout auto-merge
        if: steps.closeout.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOSEOUT_PR: ${{ steps.closeout.outputs.pr_number }}
          CLOSEOUT_HEAD_SHA: ${{ steps.closeout.outputs.head_sha }}
        run: |
          pr_number="$CLOSEOUT_PR"
          mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
          gh pr merge "$pr_number" --auto --squash --match-head-commit "$CLOSEOUT_HEAD_SHA"
