name: Publish Thunderbird extension to ATN

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      verify_metadata_only:
        required: false
        type: boolean
        default: false
    secrets:
      ATN_JWT_ISSUER:
        required: true
      ATN_JWT_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified thunderbird-extension-vX.Y.Z GitHub release
        required: true
        type: string
      verify_metadata_only:
        description: Verify the existing public XPI and report release-note status
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: thunderbird-addons-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-thunderbird-addons:
    name: Submit and verify exact extension release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: thunderbird-addons
    steps:
      - name: Reject unsupported publication tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^thunderbird-extension-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must have canonical form thunderbird-extension-vX.Y.Z" >&2
            exit 1
          }

      - name: Check out reviewed publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the immutable tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify publication tag commit belongs to main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git -C release-source rev-parse HEAD)" = "$commit" || {
            echo "Checked out source must match the publication tag commit" >&2
            exit 1
          }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Publication automation commit must be contained in origin/main" >&2
            exit 1
          }
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || {
            echo "Release tag commit must be contained in origin/main" >&2
            exit 1
          }

      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install locked dependencies
        run: mise exec -- npm ci

      - name: Download and verify the qualified extension release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          version=${RELEASE_TAG#thunderbird-extension-v}
          mkdir -p release/assets
          mkdir release/canonical
          gh release download "$RELEASE_TAG" --dir release/assets
          mise exec -- node scripts/release-metadata.mjs --root release-source --tag "$RELEASE_TAG" --notes-output release/canonical/release-notes.md
          gh release view "$RELEASE_TAG" --json body --jq .body > release/github-release-notes.md
          mise exec -- node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { verifyMarketplaceNotes } from "./scripts/verify-marketplace-notes.mjs";
          verifyMarketplaceNotes(await readFile("release/canonical/release-notes.md", "utf8"), await readFile("release/assets/release-notes.md", "utf8"), "GitHub asset");
          verifyMarketplaceNotes(await readFile("release/canonical/release-notes.md", "utf8"), await readFile("release/github-release-notes.md", "utf8"), "GitHub");
          NODE
          mise exec -- node scripts/verify-marketplace-release.mjs \
            --directory release/assets \
            --component thunderbird-extension \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$commit"
          for artifact in "release/assets/thunderclaw-thunderbird-${version}.xpi" "release/assets/thunderclaw-thunderbird-source-${version}.zip"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$commit"
          done
          test "$(unzip -p "release/assets/thunderclaw-thunderbird-${version}.xpi" manifest.json | jq -r .version)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Submit exact XPI to ATN signing
        if: ${{ !inputs.verify_metadata_only }}
        env:
          ATN_JWT_ISSUER: ${{ secrets.ATN_JWT_ISSUER }}
          ATN_JWT_SECRET: ${{ secrets.ATN_JWT_SECRET }}
          THUNDERCLAW_VERSION: ${{ steps.release.outputs.version }}
          THUNDERCLAW_XPI: ${{ github.workspace }}/release/assets/thunderclaw-thunderbird-${{ steps.release.outputs.version }}.xpi
        run: mise exec -- node scripts/submit-thunderbird-addon.mjs | tee "$RUNNER_TEMP/atn-submission.json"

      - name: Record accepted upload and next verification
        if: ${{ !inputs.verify_metadata_only && success() }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          {
            echo "### ATN accepted the XPI — public verification pending"
            echo
            echo "The signing API accepted ${RELEASE_TAG}. ATN may publish automatically; inspect Developer Hub for this version's actual reviewer requirements."
            echo "If ATN requests source or private testing notes, supply thunderclaw-thunderbird-source-${RELEASE_VERSION}.zip and the canonical reviewer instructions for this same version."
            echo "Run verify_metadata_only for this existing tag to verify the public XPI and report release-note status. Do not upload again while waiting for review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and download public ATN XPI and report release notes
        if: ${{ inputs.verify_metadata_only }}
        run: |
          mise exec -- node scripts/verify-atn-release.mjs \
            --version '${{ steps.release.outputs.version }}' \
            --notes-file release/assets/release-notes.md \
            --xpi 'release/assets/thunderclaw-thunderbird-${{ steps.release.outputs.version }}.xpi' \
            --download-output '${{ runner.temp }}/thunderclaw-atn-signed-${{ steps.release.outputs.version }}.xpi' \
            | tee "$RUNNER_TEMP/atn-submission.json"

      - name: Verify public XPI is identical or adds only signature metadata
        if: ${{ inputs.verify_metadata_only }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mise exec -- node scripts/verify-atn-xpi-payload.mjs \
            --qualified "release/assets/thunderclaw-thunderbird-${RELEASE_VERSION}.xpi" \
            --public "$RUNNER_TEMP/thunderclaw-atn-signed-${RELEASE_VERSION}.xpi" \
            | tee "$RUNNER_TEMP/atn-payload-verification.json"

      - name: Smoke-test the exact public ATN-signed XPI
        if: ${{ inputs.verify_metadata_only }}
        env:
          THUNDERCLAW_E2E_ARTIFACTS: ${{ runner.temp }}/atn-smoke
          THUNDERCLAW_E2E_VERSIONS: 153.0.3
          THUNDERCLAW_E2E_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          THUNDERCLAW_E2E_XPI: ${{ runner.temp }}/thunderclaw-atn-signed-${{ steps.release.outputs.version }}.xpi
        run: mise exec -- npm run test:e2e:thunderbird

      - name: Record verified ATN metadata
        if: ${{ inputs.verify_metadata_only && success() }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          {
            echo "### Verified public ATN artifact"
            echo
            echo "ATN exposes the public XPI for ${RELEASE_TAG}; its payload matches the qualified XPI and that exact public artifact passed Generate/Preview/Apply/Undo smoke. Reviewer source and private testing-note requirements must be checked in Developer Hub if ATN requests them."
            echo
            notes_status=$(jq -r .releaseNotesStatus "$RUNNER_TEMP/atn-submission.json")
            echo "Public release notes: ${notes_status}. Release-note metadata can be maintained separately; it does not block artifact verification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain ATN result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-atn-submission-${{ steps.release.outputs.version }}
          path: |
            ${{ runner.temp }}/atn-submission.json
            ${{ runner.temp }}/atn-payload-verification.json
            ${{ runner.temp }}/atn-smoke/
          if-no-files-found: warn
          retention-days: 30
