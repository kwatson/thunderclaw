name: Complete existing OpenClaw plugin publication
run-name: Complete publication ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified plugin release to finish without rebuilding
        required: true
        type: string
      release_run_id:
        description: Original protected-tag release run that passed qualification
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: plugin-publication-${{ inputs.tag }}
  cancel-in-progress: false

env:
  OPENCLAW_AUTOPILOT_ENABLED: ${{ vars.OPENCLAW_AUTOPILOT_ENABLED }}

jobs:
  verify:
    name: Authenticate existing qualified release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      size: ${{ steps.release.outputs.size }}
      state_commit: ${{ steps.release.outputs.state_commit }}
      already_published: ${{ steps.public.outputs.already_published }}
    steps:
      - name: Require protected automation source
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then test "$REF" = refs/heads/main; fi
      - name: Check out protected publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Verify source run, public bytes, provenance, and active reservation
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^openclaw-plugin-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
          mkdir release
          gh release download "$RELEASE_TAG" --dir release
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > release/run.json
          gh run view "$RELEASE_RUN_ID" --json jobs --jq .jobs > release/jobs.json
          state_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/automation/openclaw-autopilot-state" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/state.json?ref=$state_commit" --jq .content | base64 --decode > release/state.json
          version=${RELEASE_TAG#openclaw-plugin-v}
          result=$(mise exec -- node scripts/verify-plugin-publication-resume.mjs \
            --directory release --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$commit" --run-id "$RELEASE_RUN_ID")
          gh attestation verify "release/thunderclaw-openclaw-plugin-$version.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-openclaw-plugin.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$commit"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "size=$(jq -r .size <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "state_commit=$state_commit" >> "$GITHUB_OUTPUT"
      - name: Probe for an exact verified ClawHub publication
        id: public
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Inspect the original upload even when public bytes are already visible.
          publisher=$(mise exec -- node scripts/clawhub-publication-recovery.mjs find "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT")
          if [[ "$publisher" != null ]]; then
            run_id=$(jq -r .id <<<"$publisher")
            mkdir publisher-evidence
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > publisher-evidence/run.json
            gh run download "$run_id" --name "thunderclaw-clawhub-publication-${RELEASE_TAG#openclaw-plugin-v}" --dir publisher-evidence || true
            mise exec -- node scripts/clawhub-publication-recovery.mjs publisher-evidence/run.json \
              publisher-evidence/clawhub-publish.json "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT"
          fi
          already_published=$(mise exec -- node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { verifyClawHubRelease, ClawHubPendingError } from './scripts/verify-marketplace-notes.mjs';
          const tag = process.env.RELEASE_TAG;
          const version = tag.slice('openclaw-plugin-v'.length);
          try {
            await verifyClawHubRelease({ packageName: '@thunderclaw/openclaw-plugin', version,
              notesFile: 'release/release-notes.md', artifact: `release/thunderclaw-openclaw-plugin-${version}.tgz`,
              repository: process.env.GITHUB_REPOSITORY, tag, commit: process.env.RELEASE_COMMIT, timeoutMs: 0 });
            console.log('true');
          } catch (error) {
            if (!(error instanceof ClawHubPendingError)) {
              const run = JSON.parse(await readFile('publisher-evidence/run.json', 'utf8').catch(() => 'null'));
              if (run) await writeFile('publisher-evidence/reconciliation.json', JSON.stringify({status:'terminal',tag,commit:process.env.RELEASE_COMMIT,publisherRunId:run.id}));
              throw error;
            }
            console.log('false');
          }
          NODE
          )
          echo "already_published=$already_published" >> "$GITHUB_OUTPUT"
      - name: Retain publication probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-publication-probe-${{ inputs.tag }}
          path: publisher-evidence/
          if-no-files-found: ignore
          retention-days: 90

  clawhub-auto:
    name: Dispatch and verify tokenless ClawHub promotion
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: autopilot-closeout
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out protected publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Mint the narrow workflow-dispatch token
        if: needs.verify.outputs.already_published != 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.OPENCLAW_AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.OPENCLAW_AUTOPILOT_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: read
      - name: Dispatch and await the exact protected-tag publisher
        if: needs.verify.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISHER_READ_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_SHA256: ${{ needs.verify.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          title="Publish ClawHub $RELEASE_TAG (automatic)"
          # Share one 80-minute budget between waiting and read-only recovery,
          # leaving ten minutes for job setup and cleanup under its 90-minute cap.
          publication_deadline=$((SECONDS + 4800))
          find_run() {
            local selected
            selected=$(GH_TOKEN="$PUBLISHER_READ_TOKEN" mise exec -- node scripts/clawhub-publication-recovery.mjs find "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT") || return $?
            if [[ "$selected" != null ]]; then printf '%s\n' "$selected"; fi
          }
          run=$(find_run)
          if [[ -z "$run" ]]; then
            mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
            set +e
            gh workflow run .github/workflows/publish-clawhub.yml --ref "$RELEASE_TAG" \
              -f tag="$RELEASE_TAG" -f release_lane=automatic
            dispatch_status=$?
            set -e
            if [[ "$dispatch_status" -ne 0 ]]; then
              echo "::warning::Publisher dispatch was not acknowledged; probing for the exact run before deciding the outcome."
            fi
            run=""
          fi
          for _ in $(seq 1 480); do
            if (( SECONDS >= publication_deadline )); then break; fi
            if [[ -z "$run" ]]; then run=$(find_run); fi
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == completed ]]; then
              run_id=$(jq -r .id <<<"$run")
              mkdir -p publisher-evidence
              GH_TOKEN="$PUBLISHER_READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > publisher-evidence/run.json
              # Submission evidence is retained before the publisher waits for scanning.
              # Failed or cancelled workflows must never be rerun automatically: an
              # accepted upload may still be scanning after its verifier timed out.
              version=${RELEASE_TAG#openclaw-plugin-v}
              GH_TOKEN="$PUBLISHER_READ_TOKEN" gh run download "$run_id" \
                --name "thunderclaw-clawhub-publication-$version" --dir publisher-evidence || true
              action=$(mise exec -- node scripts/clawhub-publication-recovery.mjs \
                publisher-evidence/run.json publisher-evidence/clawhub-publish.json \
                "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT")
              if [[ "$action" == complete ]]; then exit 0; fi
              if [[ "$action" == verify-public ]]; then
                echo "::notice::Submission is accepted or unconfirmed; verifying existing publication without another upload."
                mkdir -p release
                GH_TOKEN="$PUBLISHER_READ_TOKEN" gh release download "$RELEASE_TAG" --dir release \
                  --pattern "thunderclaw-openclaw-plugin-$version.tgz" --pattern release-notes.md
                echo "$RELEASE_SHA256  release/thunderclaw-openclaw-plugin-$version.tgz" | sha256sum --check --strict
                remaining_seconds=$((publication_deadline - SECONDS))
                if (( remaining_seconds <= 0 )); then
                  echo "::error::Publication waiting budget exhausted; resume read-only verification of the retained submission."
                  jq -n --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --argjson publisherRunId "$run_id" '{status:"pending",tag:$tag,commit:$commit,publisherRunId:$publisherRunId}' > publisher-evidence/reconciliation.json
                  exit 75
                fi
                verification_seconds=$remaining_seconds
                if (( verification_seconds > 3600 )); then verification_seconds=3600; fi
                set +e
                timeout --kill-after=10s "${remaining_seconds}s" mise exec -- node scripts/verify-marketplace-notes.mjs \
                  --package @thunderclaw/openclaw-plugin --version "$version" \
                  --notes-file release/release-notes.md --artifact "release/thunderclaw-openclaw-plugin-$version.tgz" \
                  --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
                  --timeout-ms "$((verification_seconds * 1000))"
                verification_status=$?
                set -e
                if [[ "$verification_status" -ne 0 ]]; then
                  status=terminal
                  if [[ "$verification_status" == 75 || "$verification_status" == 124 ]]; then status=pending; fi
                  jq -n --arg status "$status" --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --argjson publisherRunId "$run_id" '{status:$status,tag:$tag,commit:$commit,publisherRunId:$publisherRunId}' > publisher-evidence/reconciliation.json
                  echo "Existing submission remains $status; preserve its original evidence for reconciliation." >> "$GITHUB_STEP_SUMMARY"
                  exit "$verification_status"
                fi
                exit 0
              fi
            fi
            sleep 10
            run=""
          done
          echo "Timed out waiting for the exact ClawHub publication workflow" >&2
          exit 1
      - name: Retain original publisher and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thunderclaw-publication-reconciliation-${{ needs.verify.outputs.tag }}
          path: publisher-evidence/
          if-no-files-found: ignore
          retention-days: 90

  counterpart-closeout:
    name: Open exact counterpart baseline closeout
    needs: [verify, clawhub-auto]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: autopilot-closeout
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Mint a narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.OPENCLAW_AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.OPENCLAW_AUTOPILOT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
      - name: Check out current protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install managed runtimes
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Verify public bytes and prepare the one-file closeout
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(mise exec -- node scripts/update-counterpart-baseline.mjs \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --expected-sha256 '${{ needs.verify.outputs.sha256 }}' \
            --expected-size '${{ needs.verify.outputs.size }}')
          status=$(jq -r .status <<<"$result")
          case "$status" in
            already-complete)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
            updated)
              test "$(git diff --name-only)" = e2e/qualification/counterpart-baselines.json || {
                echo "Counterpart closeout may change exactly one file" >&2
                exit 1
              }
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown counterpart updater status" >&2; exit 1 ;;
          esac
          echo "baseline=$(jq -c --arg repository "$GITHUB_REPOSITORY" '.baseline + {repository:$repository}' <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: Open or update deterministic closeout pull request
        id: closeout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/counterpart-${RELEASE_TAG}"
          if [[ "${{ steps.update.outputs.changed }}" == true ]]; then
            desired=$(mktemp "$RUNNER_TEMP/counterpart-baseline.XXXXXX")
            cp e2e/qualification/counterpart-baselines.json "$desired"
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
              unexpected=$(git diff --name-only origin/main..."refs/remotes/origin/$branch" \
                | grep -Fvx e2e/qualification/counterpart-baselines.json || true)
              test -z "$unexpected" || { echo "Existing closeout branch changes unexpected files" >&2; exit 1; }
              git switch --create "$branch" "refs/remotes/origin/$branch"
            else
              git switch --create "$branch" origin/main
            fi
            cp "$desired" e2e/qualification/counterpart-baselines.json
            git config user.name thunderclaw-autopilot[bot]
            git config user.email 000000+thunderclaw-autopilot[bot]@users.noreply.github.com
            if ! git diff --quiet -- e2e/qualification/counterpart-baselines.json; then
              git add e2e/qualification/counterpart-baselines.json
              git commit -m "chore(release): record ${RELEASE_TAG} counterpart"
              mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
              git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                push origin "HEAD:refs/heads/$branch"
            fi
          fi
          pr=$(gh pr list --head "$branch" --state all --json number,state,mergedAt --jq '.[0] // empty')
          if [[ -z "$pr" ]]; then
            mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
            gh pr create --head "$branch" --base main \
              --title "Record ${RELEASE_TAG} counterpart" \
              --body "Records the exact publicly verified ${RELEASE_TAG} artifact for future pair qualification."
            pr=$(gh pr list --head "$branch" --state open --json number,state,mergedAt --jq '.[0]')
          fi
          state=$(jq -r .state <<<"$pr")
          [[ "$state" == OPEN || "$state" == MERGED ]] || { echo "Existing closeout pull request is closed without merge" >&2; exit 1; }
          pr_number=$(jq -r .number <<<"$pr")
          pr_details=$(gh pr view "$pr_number" --json headRefOid,mergeCommit)
          head_sha=$(jq -r .headRefOid <<<"$pr_details")
          head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_tree=$head_tree" >> "$GITHUB_OUTPUT"
          echo "merged=$([[ "$state" == MERGED ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$state" == MERGED ]]; then
            merge_sha=$(jq -r .mergeCommit.oid <<<"$pr_details")
            merge_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq .tree.sha)
            echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
            echo "merge_tree=$merge_tree" >> "$GITHUB_OUTPUT"
          fi
      - name: Record verified publication and closeout state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOSEOUT_READ_TOKEN: ${{ github.token }}
          EXPECTED_STATE_COMMIT: ${{ needs.verify.outputs.state_commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          BASELINE: ${{ steps.update.outputs.baseline }}
          CLOSEOUT_BRANCH: ${{ steps.closeout.outputs.branch }}
          CLOSEOUT_PR: ${{ steps.closeout.outputs.pr_number }}
          CLOSEOUT_HEAD_SHA: ${{ steps.closeout.outputs.head_sha }}
          CLOSEOUT_HEAD_TREE: ${{ steps.closeout.outputs.head_tree }}
          CLOSEOUT_MERGED: ${{ steps.closeout.outputs.merged }}
          CLOSEOUT_MERGE_SHA: ${{ steps.closeout.outputs.merge_sha }}
          CLOSEOUT_MERGE_TREE: ${{ steps.closeout.outputs.merge_tree }}
          STATE_REF: refs/heads/automation/openclaw-autopilot-state
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/openclaw-closeout-state.XXXXXX")
          trap 'find "$work" -depth -delete' EXIT
          git fetch --no-tags origin "+$STATE_REF:refs/remotes/origin/openclaw-autopilot-state"
          state_commit=$(git rev-parse refs/remotes/origin/openclaw-autopilot-state)
          git show "$state_commit:state.json" > "$work/state.json"
          test "$(jq -r .outputs.preparation.tag "$work/state.json")" = "$RELEASE_TAG"
          update_state() {
            local intent=$1 message=$2
            persisted=$(mise exec -- node scripts/persist-openclaw-release-state.mjs "$work/state.json" "$intent" "$state_commit" "$message")
            state_commit=$(jq -r .commit <<<"$persisted")
          }
          release=$(gh release view "$RELEASE_TAG" --json databaseId)
          artifact_sha=$(jq -r .sha256 <<<"$BASELINE")
          if [[ "$(jq -r .phase "$work/state.json")" == tagged ]]; then
            jq -n --arg id "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
              --arg artifactSha256 "$artifact_sha" --argjson releaseId "$(jq -r .databaseId <<<"$release")" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"record-github-publication",at:$at,payload:{tag:$tag,commit:$commit,artifactSha256:$artifactSha256,releaseId:$releaseId}}' > "$work/intent.json"
            update_state "$work/intent.json" "Record GitHub publication"
          fi
          test "$(jq -r .outputs.githubPublication.artifactSha256 "$work/state.json")" = "$artifact_sha"
          if [[ "$(jq -r .phase "$work/state.json")" == github-published ]]; then
            jq -n --arg id "clawhub-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
              --arg artifactSha256 "$artifact_sha" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"record-clawhub-verification",at:$at,payload:{tag:$tag,version:$version,artifactSha256:$artifactSha256,verifiedAt:$at}}' > "$work/intent.json"
            update_state "$work/intent.json" "Record ClawHub verification"
          fi
          test "$(jq -r .outputs.clawhubVerification.artifactSha256 "$work/state.json")" = "$artifact_sha"
          if [[ "$(jq -r .phase "$work/state.json")" == clawhub-verified ]]; then
            jq -n --arg id "closeout-$CLOSEOUT_PR" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg branch "$CLOSEOUT_BRANCH" \
              --argjson prNumber "$CLOSEOUT_PR" --argjson baseline "$BASELINE" --arg headSha "$CLOSEOUT_HEAD_SHA" --arg tree "$CLOSEOUT_HEAD_TREE" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"open-closeout",at:$at,payload:{branch:$branch,prNumber:$prNumber,baseline:$baseline,headSha:$headSha,tree:$tree}}' > "$work/intent.json"
            update_state "$work/intent.json" "Record counterpart closeout"
          fi
          test "$(jq -r .outputs.closeout.prNumber "$work/state.json")" = "$CLOSEOUT_PR"
          if [[ "$CLOSEOUT_MERGED" == true ]]; then
            result=$(mise exec -- node scripts/openclaw-controller-recovery.mjs closeout "$work/state.json" "$GITHUB_REPOSITORY")
            [[ "$(jq -r .action <<<"$result")" == complete ]] || exit 0
            CLOSEOUT_MERGE_SHA=$(jq -r .mergeSha <<<"$result")
            CLOSEOUT_MERGE_TREE=$(jq -r .mergeTree <<<"$result")
            jq -n --arg id "complete-$CLOSEOUT_MERGE_SHA" --argjson revision "$(jq -r .revision "$work/state.json")" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg mergeSha "$CLOSEOUT_MERGE_SHA" --arg mergeTree "$CLOSEOUT_MERGE_TREE" \
              '{format:"thunderclaw-openclaw-autopilot-intent-v1",intentId:$id,expectedRevision:$revision,type:"complete-closeout",at:$at,payload:{mergeSha:$mergeSha,mergeTree:$mergeTree}}' > "$work/intent.json"
            update_state "$work/intent.json" "Complete counterpart closeout"
          fi
      - name: Enable guarded closeout auto-merge
        if: steps.closeout.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOSEOUT_PR: ${{ steps.closeout.outputs.pr_number }}
          CLOSEOUT_HEAD_SHA: ${{ steps.closeout.outputs.head_sha }}
        run: |
          pr_number="$CLOSEOUT_PR"
          mise exec -- node scripts/assert-openclaw-autopilot-enabled.mjs >/dev/null
          gh pr merge "$pr_number" --auto --squash --match-head-commit "$CLOSEOUT_HEAD_SHA"
